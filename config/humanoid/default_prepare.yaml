      - {joint_name: right_wrist_roll, position: 0.0, kp: 40.0, kd: 2.0}
      # waist
      - {joint_name: waist_pitch, position: 0.0, kp: 200.0, kd: 1.0}
      - {joint_name: waist_roll, position: 0.0, kp: 200.0, kd: 1.0}
      - {joint_name: waist_yaw, position: 0.0, kp: 200.0, kd: 5.0}
      # left_leg
      - {joint_name: left_hip_pitch, position: -0.2, kp: 300.0, kd: 5.0}
      - {joint_name: left_hip_roll, position: 0.0, kp: 300.0, kd: 5.0}
