prepare_profiles:
  stand:
    select_by_ankle_space:
      series: stand_series
      parallel: stand_parallel

  lie:
    alias_of: stand

  face:
    alias_of: stand

  stand_series:
    joints:
      # head
      - {joint_name: head_yaw, position: 0.0, kp: 80.0, kd: 2.0}
      - {joint_name: head_pitch, position: 0.0, kp: 80.0, kd: 2.0}
      # left_arm
      - {joint_name: left_shoulder_pitch, position: 0.2, kp: 80.0, kd: 2.0}
      - {joint_name: left_shoulder_roll, position: 0.13, kp: 80.0, kd: 2.0}
      - {joint_name: left_shoulder_yaw, position: 0.0, kp: 40.0, kd: 2.0}
      - {joint_name: left_elbow, position: -0.43, kp: 40.0, kd: 2.0}
      - {joint_name: left_wrist_yaw, position: 0.0, kp: 40.0, kd: 2.0}
      - {joint_name: left_wrist_pitch, position: 0.0, kp: 40.0, kd: 2.0}
      - {joint_name: left_wrist_roll, position: 0.0, kp: 40.0, kd: 2.0}
      # right_arm
      - {joint_name: right_shoulder_pitch, position: 0.2, kp: 80.0, kd: 2.0}
      - {joint_name: right_shoulder_roll, position: -0.13, kp: 80.0, kd: 2.0}
