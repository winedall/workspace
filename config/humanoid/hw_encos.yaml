    - {name: left_shoulder_yaw, motor_id: 13, direction: -1, offset: 0.0, ratio: 1.0, encos: {slave_id: 0, passage: 2, kt: 1.4, kp_min: 0.0, kp_max: 500.0, kd_min: 0.0, kd_max: 5.0, pos_min: -12.5, pos_max: 12.5, spd_min: -18.0, spd_max: 18.0, tor_min: -30.0, tor_max: 30.0, cur_min: -30.0, cur_max: 30.0}}
