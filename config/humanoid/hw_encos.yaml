    - {name: waist_yaw, motor_id: 33, direction: -1, offset: -150.0, ratio: 1.0, encos: {slave_id: 3, passage: 6, kt: 2.74, kp_min: 0.0, kp_max: 500.0, kd_min: 0.0, kd_max: 5.0, pos_min: -12.5, pos_max: 12.5, spd_min: -18.0, spd_max: 18.0, tor_min: -120.0, tor_max: 120.0, cur_min: -60.0, cur_max: 60.0}}
