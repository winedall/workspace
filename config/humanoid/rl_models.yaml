# 人形机器人强化学习模型注册表。
# model_switch_rules 定义模型切换规则。
#   pairs: 双向配对的模型列表，如 squat_down↔squat_up
#   sequences: 命名动作序列，按 motion_end 串联多个模型
model_switch_rules:
  pairs:
    - ["t4_squat_down", "t4_squat_up"]
    - ["t4_sit_down", "t4_sit_up"]
  sequences:
    kd_crawl:
      models:
        - "t4_walk"
      return_home: false

models:
  # ================ 行走类模型 ================
  z01_std_walk:
    alias: "行走"
    category: "走跑类"
    duration_sec: 0.0
    has_duration: false
    config_path: "config/z01_std_walk.yaml"
    adapter_path: "policy/adapters/z01_std_walk.py"
    artifacts:
      x86_64:
        model_path: "model/z01_std_walk.onnx"
        backend: onnx
      aarch64:
        model_path: "model/z01_std_walk.onnx"
        backend: onnx
  z01_pa_walk:
    alias: "行走"
    category: "走跑类"
    duration_sec: 0.0
