# Z01_edm（量产标准配置）URDF → XML 生成配置
# 物理/执行器参数对齐手写 t4_std.xml；地面/传感器走脚本内置默认（t4 式）。

freejoint:
  pos: "0 0 0.9"        # 基座初始高度（对齐 t4_std.xml）

# 逐关节物理参数（fnmatch 关节名，按序首个命中生效）
joints:
  - {pattern: "*_shoulder_*",  armature: 0.0236, actuatorfrcrange: "-36.0 36.0"}
  - {pattern: "*_elbow*",      armature: 0.0236, actuatorfrcrange: "-36.0 36.0"}
  - {pattern: "*_wrist_yaw",   armature: 0.0236, actuatorfrcrange: 36}
  - {pattern: "*_wrist_*",     armature: 0.0055, actuatorfrcrange: 12}
  - {pattern: "waist_yaw",     armature: 0.0943, actuatorfrcrange: 120}
  - {pattern: "waist_*",       armature: 0.0472, actuatorfrcrange: 36}
  - {pattern: "*_hip_pitch",   armature: 0.0625, actuatorfrcrange: 130}
  - {pattern: "*_knee*",       armature: 0.0625, actuatorfrcrange: 130}
  - {pattern: "*_hip_roll",    armature: 0.0943, actuatorfrcrange: 120}
  - {pattern: "*_hip_yaw",     armature: 0.0943, actuatorfrcrange: 120}
  - {pattern: "*_ankle_pitch", armature: 0.0679444, actuatorfrcrange: 72}
  - {pattern: "*_ankle_roll",  armature: 0.0229392, actuatorfrcrange: 36}

motors:
  ctrlrange: frcrange    # 跟随关节最终 actuatorfrcrange
  rules:
    - {pattern: "waist_pitch", ctrlrange: 7200}   # 对齐 t4_std.xml 的例外
    - {pattern: "waist_roll",  ctrlrange: 7200}

visuals:
  collision_rgba: "0.76 0.76 0.76 0"   # 恢复踝部碰撞 box 的透明调试色

# 手工补丁（仅 --final 输出 Z01_edm.xml 时应用）：装饰调试几何（rgba α=0，
# URDF 中已被注释掉、无法自动生成，来自手写 t4_std.xml）
patches:
  - xpath: "worldbody/body[@name='torso_link']"
    append: |
      <geom pos="0 0 0.12" type="box" size="0.05 0.08 0.17" rgba="0.76 0.76 0.76 0"/>
      <geom pos="0 0 0.36" size="0.06" rgba="0.76 0.76 0.76 0"/>
  - xpath: "worldbody/.//body[@name='left_shoulder_roll_link']"
    append: |
      <geom quat="0.707388 0 0.706825 0" type="cylinder" size="0.04 0.03" rgba="0.76 0.76 0.76 0"/>
  - xpath: "worldbody/.//body[@name='right_shoulder_roll_link']"
    append: |
      <geom quat="0.707388 0 0.706825 0" type="cylinder" size="0.04 0.03" rgba="0.76 0.76 0.76 0"/>
  - xpath: "worldbody/.//body[@name='left_elbow_link']"
    append: |
      <geom quat="0.707388 0.706825 0 0" type="cylinder" size="0.04 0.025" rgba="0.76 0.76 0.76 0"/>
  - xpath: "worldbody/.//body[@name='right_elbow_link']"
    append: |
      <geom quat="0.707388 0.706825 0 0" type="cylinder" size="0.04 0.025" rgba="0.76 0.76 0.76 0"/>
  - xpath: "worldbody/.//body[@name='left_wrist_roll_link']"
    append: |
      <geom pos="0 0 -0.02" type="box" size="0.025 0.015 0.05" rgba="0.76 0.76 0.76 0"/>
  - xpath: "worldbody/.//body[@name='right_wrist_roll_link']"
    append: |
      <geom pos="0 0 -0.02" type="box" size="0.025 0.015 0.05" rgba="0.76 0.76 0.76 0"/>
  - xpath: "worldbody/.//body[@name='left_hip_roll_link']"
    append: |
      <geom quat="0.707388 0 0.706825 0" type="cylinder" size="0.045 0.065" rgba="0.76 0.76 0.76 0"/>
  - xpath: "worldbody/.//body[@name='right_hip_roll_link']"
    append: |
      <geom quat="0.707388 0 0.706825 0" type="cylinder" size="0.045 0.065" rgba="0.76 0.76 0.76 0"/>
  - xpath: "worldbody/.//body[@name='left_knee_link']"
    append: |
      <geom quat="0.707388 0.706825 0 0" type="cylinder" size="0.05 0.05" rgba="0.76 0.76 0.76 0"/>
      <geom pos="0 0 -0.16" type="cylinder" size="0.04 0.14" rgba="0.76 0.76 0.76 0"/>
  - xpath: "worldbody/.//body[@name='right_knee_link']"
    append: |
      <geom quat="0.707388 0.706825 0 0" type="cylinder" size="0.05 0.05" rgba="0.76 0.76 0.76 0"/>
      <geom pos="0 0 -0.16" type="cylinder" size="0.04 0.14" rgba="0.76 0.76 0.76 0"/>
