{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block heading %}登录{% endblock %}
{% block content %}
<style>
.login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 60vh; }
.login-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); padding: 40px; width: 360px; }
.login-card h3 { text-align: center; margin-bottom: 24px; font-size: 20px; }
.login-card .form-group { margin-bottom: 16px; }
.login-card .btn-primary { width: 100%; padding: 10px; font-size: 16px; }
.error-msg { color: #cf1322; text-align: center; margin-bottom: 12px; display: none; font-size: 14px; }
</style>
<div class="login-wrapper">
<div class="login-card">
<h3>OTA 服务端登录</h3>
<div class="error-msg" id="errorMsg">用户名或密码错误</div>
<form id="loginForm" onsubmit="return doLogin(event)">
<div class="form-group">
<label for="username">用户名</label>
<input type="text" id="username" name="username" value="admin" required>
</div>
<div class="form-group">
<label for="password">密码</label>
<input type="password" id="password" name="password" required>
</div>
<button type="submit" class="btn btn-primary">登录</button>
</form>
</div>
</div>
<script>
function doLogin(e) {
    e.preventDefault();
    var fd = new FormData(document.getElementById('loginForm'));
    fetch('/login', { method: 'POST', body: fd }).then(function(r) {
        if (r.redirected) { window.location.href = r.url; return; }
        if (r.status === 401) { document.getElementById('errorMsg').style.display = 'block'; }
    }).catch(function() {
        document.getElementById('errorMsg').style.display = 'block';
    });
    return false;
}
</script>
{% endblock %}
