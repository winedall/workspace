# ============================================================================
# D4 Flat Himloco Lab 配置文件
# ============================================================================


model:
  name: d4_flat
  control_frequency_hz: 50
  observation_dim: 270
  action_dim: 12
  ankle_in_series: true

joint_profiles:
  run:
    joints:
      # 关节顺序: [FL_hip, FL_thigh, FL_calf, FR_hip, FR_thigh, FR_calf,
      #            RL_hip, RL_thigh, RL_calf, RR_hip, RR_thigh, RR_calf]
      # joint_mapping = [0,3,6,9, 1,4,7,10, 2,5,8,11]
      # → 策略期望顺序: [FL_hip,FR_hip,RL_hip,RR_hip,
      #                 FL_thigh,FR_thigh,RL_thigh,RR_thigh,
      #                 FL_calf,FR_calf,RL_calf,RR_calf]
      # position 定义的是物理关节的默认站立位置，会在 adapter 中映射到策略顺序
      - {joint_name: FL_hip_joint,    position: 0.0,  kp: 80.0, kd: 4.0}
      - {joint_name: FL_thigh_joint,  position: 0.8,  kp: 80.0, kd: 4.0}
      - {joint_name: FL_calf_joint,   position: -1.5,  kp: 80.0, kd: 4.0}
      - {joint_name: FR_hip_joint,    position: 0.0,  kp: 80.0, kd: 4.0}
      - {joint_name: FR_thigh_joint,  position: 0.8,  kp: 80.0, kd: 4.0}
      - {joint_name: FR_calf_joint,   position: -1.5,  kp: 80.0, kd: 4.0}
      - {joint_name: RL_hip_joint,    position: 0.0,  kp: 80.0, kd: 4.0}
      - {joint_name: RL_thigh_joint,  position: 0.8,  kp: 80.0, kd: 4.0}
      - {joint_name: RL_calf_joint,   position: -1.5,  kp: 80.0, kd: 4.0}
      - {joint_name: RR_hip_joint,    position: 0.0,  kp: 80.0, kd: 4.0}
      - {joint_name: RR_thigh_joint,  position: 0.8,  kp: 80.0, kd: 4.0}
      - {joint_name: RR_calf_joint,   position: -1.5,  kp: 80.0, kd: 4.0}
